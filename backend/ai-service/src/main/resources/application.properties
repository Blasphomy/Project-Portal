# AI Service Configuration
spring.application.name=AI Service
server.port=8082

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics,circuitbreakers,ratelimiters
management.endpoint.health.show-details=always

# Logging
logging.level.com.project.ai=DEBUG
logging.level.io.github.resilience4j=DEBUG

# AI Service Configuration
ai.service.provider=gemini
ai.service.api-key=AIzaSyCNK2MvSHBDkgVX697vwRwX8QxL0kPA5zA
ai.service.model=${AI_MODEL:gemini-2.5-flash}
ai.service.base-url=https://generativelanguage.googleapis.com/v1
ai.service.max-tokens=2000
ai.service.temperature=0.7
ai.service.cache-enabled=true
ai.service.cache-ttl-hours=168

# Pinecone Vector DB
pinecone.api-key=${PINECONE_API_KEY:dummy-key}
pinecone.environment=${PINECONE_ENVIRONMENT:gcp-starter}
pinecone.index-name=learning-content
