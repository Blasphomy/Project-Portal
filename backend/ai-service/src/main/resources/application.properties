
# AI Service Configuration
server.port=8080
spring.application.name=ai-service

# Gemini API Configuration
ai.service.api-key=${GEMINI_API_KEY}
ai.service.model=gemini-1.5-flash
ai.service.max-tokens=8192 # Increased for very large skill trees
ai.service.temperature=0.4 # Slightly lower for more deterministic output

# Pinecone Configuration
pinecone.api.key=${PINECONE_API_KEY}
pinecone.environment=${PINECONE_ENVIRONMENT}
pinecone.index.name=learning-materials

# Cohere Configuration
cohere.api.key=${COHERE_API_KEY}

# Learning Service Configuration
learning.service.url=http://learning-service:8080

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.aiService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.aiService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.aiService.waitDurationInOpenState=10s

resilience4j.retry.instances.aiService.maxAttempts=3
resilience4j.retry.instances.aiService.waitDuration=2s

resilience4j.ratelimiter.instances.aiService.limitForPeriod=10
resilience4j.ratelimiter.instances.aiService.limitRefreshPeriod=1m
resilience4j.ratelimiter.instances.aiService.timeoutDuration=2s
