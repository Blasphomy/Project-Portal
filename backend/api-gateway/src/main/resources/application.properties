# API Gateway Configuration
spring.application.name=API Gateway
server.port=8080

# Gateway Routes
spring.cloud.gateway.routes[0].id=learning-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/topics/**,/api/quests/**,/api/tasks/**

spring.cloud.gateway.routes[1].id=ai-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/ai/**

spring.cloud.gateway.routes[2].id=user-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/**,/api/users/**

# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Circuit Breaker
spring.cloud.gateway.routes[0].filters[0]=CircuitBreaker=learning-service
spring.cloud.gateway.routes[1].filters[0]=CircuitBreaker=ai-service
spring.cloud.gateway.routes[2].filters[0]=CircuitBreaker=user-service

resilience4j.circuitbreaker.instances.learning-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.learning-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.learning-service.wait-duration-in-open-state=30s

resilience4j.circuitbreaker.instances.ai-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.ai-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ai-service.wait-duration-in-open-state=60s

resilience4j.circuitbreaker.instances.user-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.user-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.user-service.wait-duration-in-open-state=30s

# Rate Limiting (Redis-based)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics,gateway
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.project.gateway=DEBUG
