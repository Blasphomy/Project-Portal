# API Gateway - Docker Profile

# Gateway Routes (Docker network)
spring.cloud.gateway.routes[0].id=learning-service
spring.cloud.gateway.routes[0].uri=http://learning-service:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/topics/**,/api/quests/**,/api/tasks/**

spring.cloud.gateway.routes[1].id=ai-service
spring.cloud.gateway.routes[1].uri=http://ai-service:8080
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/ai/**

spring.cloud.gateway.routes[2].id=user-service
spring.cloud.gateway.routes[2].uri=http://user-service:8080
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/**,/api/users/**

# Redis (Docker network)
spring.data.redis.host=redis
spring.data.redis.port=6379

# CORS (allow frontend container)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://frontend:3000,http://localhost:3000

# Container logging
logging.file.name=/app/logs/api-gateway.log
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.project.gateway=INFO
