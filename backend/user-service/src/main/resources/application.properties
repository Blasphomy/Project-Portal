# User Service Configuration
spring.application.name=User Service
server.port=8083

# JWT Configuration (Use environment variable in production!)
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-please-make-it-long-enough-for-HS256}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Database
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/learning_db
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres

# Liquibase - DISABLED (Learning Service already creates all tables)
spring.liquibase.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.project.user=DEBUG
logging.level.org.springframework.r2dbc=DEBUG
logging.level.io.r2dbc.postgresql.QUERY=DEBUG
logging.level.io.r2dbc.postgresql.PARAM=DEBUG
