# User Service - Docker Profile

# Database (External Supabase PostgreSQL)
spring.r2dbc.url=r2dbc:${DATABASE_URL:postgresql://postgres:postgres@localhost:5432/learning_db}

# Security
token.signing.key=${JWT_SECRET}

# Container logging
logging.file.name=/app/logs/user-service.log
logging.level.com.project.user=INFO
