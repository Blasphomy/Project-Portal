# User Service - Docker Profile

# Database (Docker network)
spring.r2dbc.url=r2dbc:postgresql://postgres:5432/learning_db
spring.r2dbc.username=${POSTGRES_USER}
spring.r2dbc.password=${POSTGRES_PASSWORD}

# Security
token.signing.key=${JWT_SECRET}

# Container logging
logging.file.name=/app/logs/user-service.log
logging.level.com.project.user=INFO
