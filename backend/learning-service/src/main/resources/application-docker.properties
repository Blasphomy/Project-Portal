# Docker profile configuration
spring.profiles.active=docker

# Use environment variables from docker-compose
spring.r2dbc.url=${SPRING_R2DBC_URL}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD}

spring.liquibase.url=${SPRING_FLYWAY_URL}
spring.liquibase.user=${SPRING_R2DBC_USERNAME}
spring.liquibase.password=${SPRING_R2DBC_PASSWORD}

spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}

# Logging for Docker
logging.file.name=/app/logs/application.log

# Zipkin in Docker
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
