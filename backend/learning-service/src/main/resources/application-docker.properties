# Learning Service - Docker Profile

# Database (Docker network)
spring.r2dbc.url=r2dbc:postgresql://postgres:5432/learning_db
spring.r2dbc.username=${POSTGRES_USER}
spring.r2dbc.password=${POSTGRES_PASSWORD}

# Liquibase (JDBC for migrations)
spring.liquibase.url=jdbc:postgresql://postgres:5432/learning_db
spring.liquibase.user=${POSTGRES_USER}
spring.liquibase.password=${POSTGRES_PASSWORD}

# Container logging
logging.file.name=/app/logs/learning-service.log
logging.level.com.project=INFO

