# Learning Service - Docker Profile

# Database (External Supabase PostgreSQL)
# DATABASE_URL format: postgresql://user:password@host:port/database
spring.r2dbc.url=r2dbc:${DATABASE_URL:postgresql://postgres:postgres@localhost:5432/learning_db}

# Liquibase (JDBC for migrations)
# Convert DATABASE_URL to JDBC format
spring.liquibase.url=jdbc:${DATABASE_URL:postgresql://postgres:postgres@localhost:5432/learning_db}

# Container logging
logging.file.name=/app/logs/learning-service.log
logging.level.com.project=INFO

