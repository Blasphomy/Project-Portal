# Learning Service - Docker Profile

# Database (External Supabase PostgreSQL or default local)
# Set DATABASE_URL environment variable to override
spring.r2dbc.url=${DATABASE_URL:r2dbc:postgresql://localhost:5432/learning_db}

# Liquibase (JDBC for migrations)
spring.liquibase.url=${LIQUIBASE_URL:jdbc:postgresql://localhost:5432/learning_db}

# Container logging
logging.file.name=/app/logs/learning-service.log
logging.level.com.project=INFO

