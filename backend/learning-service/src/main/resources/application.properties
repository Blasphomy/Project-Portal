# Application name
spring.application.name=Learning Platform

# Server
server.port=8081
server.compression.enabled=true

# Jackson
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# R2DBC PostgreSQL
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/learning_db
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=50
spring.r2dbc.pool.max-idle-time=30m

# Liquibase (uses JDBC for migrations)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.liquibase.url=jdbc:postgresql://localhost:5432/learning_db
spring.liquibase.user=postgres
spring.liquibase.password=postgres

# Redis - Disabled for now
#spring.data.redis.host=localhost
#spring.data.redis.port=6379
#spring.data.redis.timeout=2000ms
#spring.data.redis.lettuce.pool.max-active=8
#spring.data.redis.lettuce.pool.max-idle=8
#spring.data.redis.lettuce.pool.min-idle=2

# Cache - Disabled (using simple in-memory cache)
spring.cache.type=simple
#spring.cache.redis.time-to-live=3600000
#spring.cache.redis.cache-null-values=false
spring.cache.cache-names=study-materials,user-cache,topic-cache

# Session - Disabled
#spring.session.store-type=redis
#spring.session.timeout=86400

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics,env
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logging
logging.level.root=INFO
logging.level.com.project=DEBUG
logging.level.org.springframework.r2dbc=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/application.log

# AI Service
ai.service.provider=gemini
ai.service.api-key=${AI_API_KEY:}
ai.service.model=${AI_MODEL:gemini-1.5-flash}
ai.service.base-url=https://generativelanguage.googleapis.com/v1beta
ai.service.max-tokens=2000
ai.service.temperature=0.7
ai.service.cache-enabled=true
ai.service.cache-ttl-hours=168

# Pinecone Vector DB
pinecone.api-key=${PINECONE_API_KEY:}
pinecone.environment=${PINECONE_ENVIRONMENT:}
pinecone.index-name=learning-content

# JWT
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-please-make-it-long-enough-for-HS256}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=604800000

# OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.aiService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.aiService.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.aiService.slow-call-duration-threshold=10s
resilience4j.circuitbreaker.instances.aiService.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.aiService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.aiService.sliding-window-size=10
resilience4j.circuitbreaker.instances.aiService.minimum-number-of-calls=5

# Resilience4j Rate Limiter
resilience4j.ratelimiter.instances.aiService.limit-for-period=10
resilience4j.ratelimiter.instances.aiService.limit-refresh-period=60s
resilience4j.ratelimiter.instances.aiService.timeout-duration=5s

# Resilience4j Retry
resilience4j.retry.instances.aiService.max-attempts=3
resilience4j.retry.instances.aiService.wait-duration=2s
resilience4j.retry.instances.aiService.exponential-backoff-multiplier=2

# Zipkin Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
