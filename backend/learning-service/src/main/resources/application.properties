# Learning Service Configuration
spring.application.name=learning-service
server.port=8081
server.compression.enabled=true

# Jackson
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# R2DBC Connection Pool
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=50
spring.r2dbc.pool.max-idle-time=30m

# Liquibase (this service owns the database schema)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/db.changelog-master.xml

# Cache (simple in-memory for now)
spring.cache.type=simple
spring.cache.cache-names=study-materials,user-cache,topic-cache

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.com.project=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

