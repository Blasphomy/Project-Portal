services:
  # Learning Service
  - type: web
    name: learning-service
    env: docker
    dockerfilePath: ./infrastructure/docker/Dockerfile.learning-service
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SERVER_PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: SPRING_DATA_REDIS_HOST
        value: redis-placeholder
      - key: SPRING_DATA_REDIS_PORT
        value: 6379
    healthCheckPath: /actuator/health
    
  # User Service
  - type: web
    name: user-service
    env: docker
    dockerfilePath: ./infrastructure/docker/Dockerfile.user-service
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SERVER_PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_DATA_REDIS_HOST
        value: redis-placeholder
      - key: SPRING_DATA_REDIS_PORT
        value: 6379
    healthCheckPath: /actuator/health
    
  # AI Service
  - type: web
    name: ai-service
    env: docker
    dockerfilePath: ./infrastructure/docker/Dockerfile.ai-service
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SERVER_PORT
        value: 8080
      - key: GEMINI_API_KEY
        sync: false
      - key: SPRING_DATA_REDIS_HOST
        value: redis-placeholder
      - key: SPRING_DATA_REDIS_PORT
        value: 6379
    healthCheckPath: /actuator/health
    
  # API Gateway
  - type: web
    name: api-gateway
    env: docker
    dockerfilePath: ./infrastructure/docker/Dockerfile.api-gateway
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SERVER_PORT
        value: 8080
      - key: LEARNING_SERVICE_URL
        value: http://learning-service:8080
      - key: USER_SERVICE_URL
        value: http://user-service:8080
      - key: AI_SERVICE_URL
        value: http://ai-service:8080
    healthCheckPath: /actuator/health

