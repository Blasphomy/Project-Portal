# Optional: Monitoring Stack (Prometheus + Grafana)
# Usage: docker-compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d

version: '3.8'

services:
  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: learning-platform-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - learning-network
    depends_on:
      - api-gateway

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: learning-platform-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
    ports:
      - "3001:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    networks:
      - learning-network
    depends_on:
      - prometheus

  # PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: learning-platform-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@learning-platform.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - learning-network
    depends_on:
      - postgres

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  learning-network:
    external: true
